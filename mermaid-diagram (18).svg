<svg aria-roledescription="quadrantChart" role="graphics-document document" viewBox="0 0 500 500" style="max-width: 500px;" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="100%" id="mermaid-diagram-mermaid-laelrbd"><style>#mermaid-diagram-mermaid-laelrbd{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-diagram-mermaid-laelrbd .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-diagram-mermaid-laelrbd .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-diagram-mermaid-laelrbd .error-icon{fill:#552222;}#mermaid-diagram-mermaid-laelrbd .error-text{fill:#552222;stroke:#552222;}#mermaid-diagram-mermaid-laelrbd .edge-thickness-normal{stroke-width:1px;}#mermaid-diagram-mermaid-laelrbd .edge-thickness-thick{stroke-width:3.5px;}#mermaid-diagram-mermaid-laelrbd .edge-pattern-solid{stroke-dasharray:0;}#mermaid-diagram-mermaid-laelrbd .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-diagram-mermaid-laelrbd .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-diagram-mermaid-laelrbd .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-diagram-mermaid-laelrbd .marker{fill:#666;stroke:#666;}#mermaid-diagram-mermaid-laelrbd .marker.cross{stroke:#666;}#mermaid-diagram-mermaid-laelrbd svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-diagram-mermaid-laelrbd p{margin:0;}#mermaid-diagram-mermaid-laelrbd :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect fill="#eee" height="212" width="232" y="71" x="263"></rect><text transform="translate(379, 177) rotate(0)" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#111111" y="0" x="0">Curved Mirror (not detailed)</text></g><g class="quadrant"><rect fill="#f3f3f3" height="212" width="232" y="71" x="31"></rect><text transform="translate(147, 177) rotate(0)" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#0c0c0c" y="0" x="0">Specular Reflection (Plane Mirror)</text></g><g class="quadrant"><rect fill="#f8f8f8" height="212" width="232" y="283" x="31"></rect><text transform="translate(147, 389) rotate(0)" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#070707" y="0" x="0">Diffuse Reflection (Rough Surface)</text></g><g class="quadrant"><rect fill="#fdfdfd" height="212" width="232" y="283" x="263"></rect><text transform="translate(379, 389) rotate(0)" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#020202" y="0" x="0">N/A</text></g></g><g class="border"><line style="stroke: rgb(213, 213, 213); stroke-width: 2;" y2="71" x2="496" y1="71" x1="30"></line><line style="stroke: rgb(213, 213, 213); stroke-width: 2;" y2="494" x2="495" y1="72" x1="495"></line><line style="stroke: rgb(213, 213, 213); stroke-width: 2;" y2="495" x2="496" y1="495" x1="30"></line><line style="stroke: rgb(213, 213, 213); stroke-width: 2;" y2="494" x2="31" y1="72" x1="31"></line><line style="stroke: rgb(213, 213, 213); stroke-width: 1;" y2="494" x2="263" y1="72" x1="263"></line><line style="stroke: rgb(213, 213, 213); stroke-width: 1;" y2="283" x2="494" y1="283" x1="32"></line></g><g class="data-points"></g><g class="labels"><g class="label"><text transform="translate(147, 45) rotate(0)" text-anchor="middle" dominant-baseline="hanging" font-size="16" fill="#111111" y="0" x="0">Rough Surface</text></g><g class="label"><text transform="translate(379, 45) rotate(0)" text-anchor="middle" dominant-baseline="hanging" font-size="16" fill="#111111" y="0" x="0">Smooth Surface</text></g><g class="label"><text transform="translate(5, 389) rotate(-90)" text-anchor="middle" dominant-baseline="hanging" font-size="16" fill="#111111" y="0" x="0">Low Specularity</text></g><g class="label"><text transform="translate(5, 177) rotate(-90)" text-anchor="middle" dominant-baseline="hanging" font-size="16" fill="#111111" y="0" x="0">High Specularity</text></g></g><g class="title"><text transform="translate(250, 10) rotate(0)" text-anchor="middle" dominant-baseline="hanging" font-size="20" fill="#111111" y="0" x="0">Types of Reflection</text></g></g></svg>