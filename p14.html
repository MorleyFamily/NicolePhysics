<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Multiple SVGs Example</title>
  <style>
    body {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    img {
      width: 200px;
      height: auto;
      border: 1px solid #ccc;
      padding: 5px;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <img src="mermaid-diagram (11).svg" alt="Diagram 1">
  <img src="mermaid-diagram (10).svg" alt="Diagram 2">
  <img src="mermaid-diagram (9).svg" alt="Diagram 3">
</body>
</html>
